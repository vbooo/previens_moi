name: Android demo
on:
  push:
    paths: ["android/**", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "scripts/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: python3 scripts/check-android-boundaries.py
      - run: ./gradlew --no-daemon assembleDemoDebug testDemoDebugUnitTest lintDemoDebug
        working-directory: android
      - run: python3 scripts/check-android-boundaries.py --merged
